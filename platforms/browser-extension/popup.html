<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>El Dorado Assistant</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <canvas id="agParticles" class="ag-particles-bg" aria-hidden="true"></canvas>
    <main class="shell">
      <header class="header">
        <div class="brand">
          <img src="icons/icon48.png" alt="El Dorado logo" />
          <div class="brand-title">
            <h1>El Dorado</h1>
            <span class="shortcut-tag">Alt + D + T</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="themeToggleBtn" class="icon-btn" type="button" title="Toggle Dark/Light Theme">Dark</button>
          <button id="soundToggleBtn" class="icon-btn active" type="button" title="Toggle sound chimes">Sound On</button>
          <button id="openSidePanelBtn" class="icon-btn" type="button">Side Panel</button>
          <button id="settingsToggleBtn" class="icon-btn" type="button">Server</button>
        </div>
      </header>

      <div id="settingsBox" class="settings-box" hidden>
        <label for="serverUrlInput">El Dorado Backend URL (Optional for cloud AI Q&amp;A)</label>
        <input id="serverUrlInput" type="url" placeholder="https://your-el-dorado-server.com" />
        <button id="saveServerBtn" class="icon-btn" type="button">Save Backend URL</button>
      </div>

      <section class="orb-stage">
        <h2 class="ag-greeting">Good to see you. What&apos;s next?</h2>
        <div class="orb-wrap">
          <button id="micBtn" class="mic-orb" type="button" aria-label="Activate El Dorado voice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
          </button>
        </div>
        <div id="waveBars" class="wave-bars" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div id="orbStatus" class="orb-status">El Dorado is ready</div>
        <div id="orbSub" class="orb-sub">Press Alt + D + T (or Alt + D) or tap the orb to speak.</div>
        <div class="orb-controls">
          <button id="wakeBtn" class="icon-btn" type="button">Hey El Dorado Mode</button>
          <select id="langSelect" class="lang-select" aria-label="Voice recognition language">
            <option value="en-US">English (US)</option>
            <option value="en-IN">English (India)</option>
            <option value="en-GB">English (UK)</option>
          </select>
        </div>
      </section>

      <section id="feed" class="feed" aria-live="polite">
        <div class="orb-sub empty-hint">Ask anything (&ldquo;What is quantum computing?&rdquo;, &ldquo;What is 25 * 48?&rdquo;) or say &ldquo;open YouTube&rdquo;, &ldquo;new tab&rdquo;, &ldquo;scroll down&rdquo;.</div>
      </section>

      <div class="quick-grid">
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, open YouTube">YouTube</button>
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, new tab">New Tab</button>
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, scroll down">Scroll ↓</button>
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, zoom in">Zoom +</button>
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, mute tab">Mute Tab</button>
        <button class="quick-btn" type="button" data-cmd="Hey El Dorado, what is 25 * 48?">Ask AI</button>
      </div>

      <form id="cmdForm" class="input-row">
        <input id="cmdInput" type="text" placeholder="Ask anything or say 'open YouTube'..." />
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="ui.js"></script>
  </body>
</html>
